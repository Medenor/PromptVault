name: Accessibility

on:
  push:
  pull_request:

jobs:
  axe-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start server
        run: |
          UVICORN_RELOAD=false python3 run_web.py &
          echo "Waiting for server..."
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8003/ >/dev/null; then
              echo "Server is up."
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start in time"
          exit 1

      - name: Axe scans (public routes)
        env:
          ACCESSIBILITY_EXTERNAL_SERVER: "1"
          ACCESSIBILITY_BASE_URL: http://127.0.0.1:8003
        run: |
          python3 scripts/accessibility_test.py --workers 1 --verbose \
            --page / \
            --page /import-export \
            --page /backup-management \
            --page /auth/login \
            --page /auth/register \
            --page /auth/forgot-password \
            --page "/auth/reset-password?token=test"

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build frontend
        run: npm run build

      - name: Start server
        run: |
          UVICORN_RELOAD=false python3 run_web.py &
          echo "Waiting for server..."
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8003/ >/dev/null; then
              echo "Server is up."
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start in time"
          exit 1

      - name: Lighthouse CI (accessibility >= 95)
        run: npm run test:ui:lighthouse

