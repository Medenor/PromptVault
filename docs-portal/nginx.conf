server {
    listen 8080;
    server_name _;
    # Keep directory redirects relative so Docker's internal port never leaks
    # into links requested through the published host port or a reverse proxy.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Docusaurus fingerprints files under /assets/, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
