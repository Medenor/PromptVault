[pytest]
minversion = 8.0
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --cov=scripts/setup
    --cov-config=tests/setup/.coveragerc
    --cov-report=term-missing
    --cov-report=html:htmlcov/setup
    --cov-fail-under=85
    -ra
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    performance: marks tests as performance tests

[coverage:run]
omit =
    scripts/setup/tests/*
    */scripts/setup/tests/*
    */tests/*
