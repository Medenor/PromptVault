<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PromptVault</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
    <script src="https://unpkg.com/i18next@23.7.6/i18next.min.js"></script>
    <script src="https://unpkg.com/i18next-browser-languagedetector@7.2.0/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="https://unpkg.com/i18next-http-backend@2.4.2/i18nextHttpBackend.min.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="header-logo">
                <img src="/static/images/promptvault_logo_frontend.webp" alt="PromptVault Logo" class="logo">
            </div>
            <h1>PromptVault</h1>
            <div class="language-selector-wrapper">
                <select id="language-selector" class="language-selector">
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                    <option value="de">Deutsch</option>
                </select>
            </div>
        </div>

        <div class="auth-box">
            <h2 data-i18n="auth.login.title">Login</h2>
            <p class="auth-subtitle" data-i18n="auth.login.subtitle">Sign in to your account</p>

            <form id="login-form" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="username-or-email" data-i18n="auth.login.usernameOrEmail">Username or Email:</label>
                    <input
                        type="text"
                        id="username-or-email"
                        name="username_or_email"
                        data-i18n="[placeholder]auth.login.usernamePlaceholder"
                        required
                        autocomplete="username"
                        aria-required="true"
                        aria-describedby="username-error">
                    <div class="validation-error" id="username-error" role="alert" aria-live="assertive"></div>
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="auth.login.password">Password:</label>
                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            data-i18n="[placeholder]auth.login.passwordPlaceholder"
                            required
                            autocomplete="current-password"
                            aria-required="true"
                            aria-describedby="password-error">
                        <button type="button" class="password-toggle" id="toggle-password" aria-label="Toggle password visibility">
                            <span class="password-toggle-icon">👁️</span>
                        </button>
                    </div>
                    <div class="validation-error" id="password-error" role="alert" aria-live="assertive"></div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input
                            type="checkbox"
                            id="remember-me"
                            name="remember_me"
                            aria-label="Remember me">
                        <span data-i18n="auth.login.rememberMe">Remember me</span>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" data-i18n="auth.login.loginButton">Login</button>
                </div>

                <div class="auth-links">
                    <a href="/auth/forgot-password" data-i18n="auth.login.forgotPassword">Forgot password?</a>
                    <a href="/auth/register" data-i18n="auth.login.noAccount">Don't have an account? Register</a>
                </div>
            </form>

            <div id="account-locked-message" class="auth-warning is-hidden">
                <p data-i18n="auth.login.accountLocked">Your account has been locked due to too many failed login attempts. Please try again later or reset your password.</p>
            </div>
        </div>
    </div>

    <script src="/static/js/telemetry.js?v=2" defer></script>
    <script type="module" src="/static/js/auth.js?v=2"></script>
</body>
</html>
