<select
  class="language-selector px-2 py-1 text-xs rounded border border-gray-300 bg-white text-gray-900 focus:outline-none focus:ring-1 focus:ring-blue-500"
  aria-label="{{ 'nav.language' }}"
  data-i18n="[aria-label]nav.language"
>
  <option value="en">EN</option>
  <option value="fr">FR</option>
  <option value="es">ES</option>
  <option value="de">DE</option>
</select>
