<select
  class="language-selector px-1.5 py-1 text-xs md:px-3 md:py-2 md:text-sm rounded-md border border-gray-400 bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
  aria-label="{{ 'nav.language' }}"
  data-i18n="[aria-label]nav.language"
>
  <option value="en">EN</option>
  <option value="fr">FR</option>
  <option value="es">ES</option>
  <option value="de">DE</option>
</select>
