services:
  promptvault-web:
    build: .
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data:rw
      - ./assets:/app/assets:ro
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
