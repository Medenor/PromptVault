services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: promptvault-db
    environment:
      POSTGRES_DB: promptvault
      POSTGRES_USER: promptvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port 5432 not exposed externally - accessible only within Docker network
    # Uncomment the following lines if you need external access (change port if 5432 is in use):
    # ports:
    #   - "5433:5432"  # Use 5433 on host if 5432 is already in use
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptvault"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PromptVault Web Application
  web:
    build: .
    container_name: promptvault-web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data:rw
      - ./assets:/app/assets:ro
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://promptvault:${POSTGRES_PASSWORD:-changeme}@db:5432/promptvault
      - DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
