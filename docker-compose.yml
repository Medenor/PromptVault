services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: promptvault-db
    user: 'postgres'
    environment:
      POSTGRES_DB: promptvault
      POSTGRES_USER: promptvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port 5432 not exposed externally - accessible only within Docker network
    # Uncomment the following lines if you need external access (change port if 5432 is in use):
    # ports:
    #   - "5433:5432"  # Use 5433 on host if 5432 is already in use
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U promptvault']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache - Used for rate limiting and session storage
  redis:
    image: redis:7-alpine
    container_name: promptvault-redis
    user: 'redis'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # PromptVault Web Application
  web:
    build: .
    container_name: promptvault-web
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8001:8001'
    volumes:
      - ./data:/app/data:rw
      - ./assets:/app/assets:ro
      - ./secrets/jwt:/app/secrets/jwt:ro
    environment:
      - PYTHONPATH=/app
      - PORT=8001
      - DATABASE_URL=postgresql://promptvault:${POSTGRES_PASSWORD:-changeme}@db:5432/promptvault
      - REDIS_URL=redis://redis:6379/0
      - PROMPTVAULT_DATA_DIR=/app/data
      - JWT_PRIVATE_KEY_PATH=/app/secrets/jwt/private_key.pem
      - JWT_PUBLIC_KEY_PATH=/app/secrets/jwt/public_key.pem
      - JWT_ACCESS_TOKEN_EXPIRE_SECONDS=${JWT_ACCESS_TOKEN_EXPIRE_SECONDS:-900}
      - JWT_REFRESH_TOKEN_EXPIRE_SECONDS=${JWT_REFRESH_TOKEN_EXPIRE_SECONDS:-604800}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DISABLE_RATE_LIMITING=${DISABLE_RATE_LIMITING:-false}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8001/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
