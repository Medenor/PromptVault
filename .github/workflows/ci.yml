name: CI

# No push-to-main trigger: the PR run already tested the change. Use workflow_dispatch to
# re-run everything on a branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the latest push to a PR runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The workflow always runs so the required `lint` and `test` checks always
  # report. A path filter at the workflow level (`paths-ignore`) would leave them
  # pending forever on docs-only PRs and block merging. Instead, `lint` and `test`
  # are skipped here, and a skipped job satisfies a required check.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/${BASE_REF}...HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}...HEAD"
          else
            echo "No usable base to diff against; treating as a code change."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same ignore list the workflow used to carry in `paths-ignore`.
          code_files=$(git diff --name-only "$range" | grep -vE '(\.md$|^docs/|^docs-portal/|^specs/|^\.specify/)' || true)
          if [ -n "$code_files" ]; then
            echo "Code changes detected:"; echo "$code_files"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change; lint and test are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # check-file-sizes and check-sw-cache-version diff against the merge base

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ripgrep (used by the print() guard in make lint)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Install dependencies
        run: make install

      - name: Lint
        env:
          CI_MERGE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: make lint

  test:
    name: test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: make install

      - name: Build frontend (template snapshot tests read dist/static/manifest)
        run: make build-frontend

      - name: Generate JWT keys (secrets/ is not versioned)
        run: .venv/bin/python scripts/generate_jwt_keys.py

      - name: Test
        run: make test
