name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install ripgrep (used by the print() guard in make lint)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Install dependencies
        run: make install

      - name: Lint
        env:
          CI_MERGE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: make lint

      - name: Build frontend (template snapshot tests read dist/static/manifest)
        run: make build-frontend

      - name: Generate JWT keys (secrets/ is not versioned)
        run: .venv/bin/python scripts/generate_jwt_keys.py

      - name: Test
        run: make test
