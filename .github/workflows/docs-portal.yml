name: Docs Portal

on:
  push:
    branches: [main]
    paths: ['docs-portal/**']
  pull_request:
    branches: [main]
    paths: ['docs-portal/**']

# Only the latest push to a PR runs; main pushes are never cancelled.
concurrency:
  group: docs-portal-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs-portal
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs-portal/package-lock.json

      # `npm ci` installs exactly what package-lock.json pins (`npm install` could rewrite it).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check i18n parity
        run: npm run docs:check-parity

      - name: Build
        run: npm run docs:build
