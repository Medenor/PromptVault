[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=85
    -ra
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    performance: marks tests as performance tests
    network: marks tests that download from the internet (skipped when offline)
    postgres: marks tests requiring a PostgreSQL DATABASE_URL (auto-skipped otherwise; see conftest_db.postgres_db)

[coverage:run]
omit =
    # Database-backed backup service (integration-heavy, covered by E2E)
    src/services/backup_service_db.py
    # Database health checks (not critical for core functionality)
    src/db/health.py
