[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptvault"
version = "1.15.0"
description = "Web-based prompt manager for organizing and versioning AI prompts."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Medenor" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Utilities",
  "Framework :: FastAPI",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.163.1",
  "uvicorn[standard]>=0.24.0",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.34",
  "aiofiles>=23.2.1",
  "sqlalchemy>=2.1.9,<2.2",
  "alembic>=1.20.1",
  "psycopg2-binary>=2.9.13",
  "greenlet>=3.5.6",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.3",
  "httpx<0.29",
  "argon2-cffi>=23.1.0",
  "PyJWT>=2.8.0",
  "cryptography>=41.0.0",
  "slowapi>=0.1.9",
  "redis>=8.1.0",
  "python-jose[cryptography]>=3.3.0",
  "user-agents>=2.2.0",
  "apscheduler>=3.10.0",
  "diff-match-patch>=20230430",
  "click>=8.5.1",
  "rich>=13.0.0",
  "boto3>=1.44.4",
  "pyotp>=2.12.0",
  "qrcode>=7.4.2",
  "PyYAML>=6.0",
  "markdown-it-py>=4.3.0",
  "nh3>=0.3.8",
]

[project.optional-dependencies]
test = [
  "pytest>=9.2.0",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=1.5.0",
  "freezegun>=1.4.0",
]
dev = [
  "black>=26.10.1",
  "ruff>=0.17.5",
  "mypy>=2.4.1",
]
setup = [
  "click>=8.5.1",
  "rich>=13.0.0",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/Medenor/PromptVault"
Repository = "https://github.com/Medenor/PromptVault"
Issues = "https://github.com/Medenor/PromptVault/issues"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# F=pyflakes, E/W=pycodestyle, UP=pyupgrade, I=isort, B=bugbear.
# Deliberately not enabling BLE/TRY/S/G/SIM/ASYNC/PERF/PLW/C4/FURB/RUF(misc):
# opinionated/pedantic rule families left for a future, separately-scoped pass.
select = ["F", "E", "W", "UP", "I", "B"]
ignore = [
    "B008",  # FastAPI Depends()/Header()/Cookie() call-in-default is the intended idiom
    "E501",  # line length is black's job; black doesn't wrap comments/docstrings/strings
    "E712",  # `== True`/`== False` is required (not `is`) for SQLAlchemy column filter expressions
    "UP046", # PEP 695 generic syntax: skip for now, ModelType TypeVar is shared across repository subclasses
    "B017",  # pytest.raises(Exception) is broad but narrowing requires per-call domain knowledge; future cleanup
    "UP037", # Mapped["X"] quotes are load-bearing: X is only imported under TYPE_CHECKING (no
             # `from __future__ import annotations`), and Mapped[] is evaluated at class-body time.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # pytest fixture redefinition/shadowing is idiomatic

# Wired into `make lint-backend` (see #82: SQLAlchemy models migrated from
# legacy Column() declarative style to Mapped[T]/mapped_column(), eliminating
# the ~350 false-positive arg-type/assignment/union-attr errors that blocked
# gating mypy in CI).
[tool.mypy]
python_version = "3.14"

[[tool.mypy.overrides]]
module = [
    "diff_match_patch",
    "user_agents",
    "apscheduler.*",
    "boto3",
    "botocore.*",
    "qrcode.*",
    "yaml",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
