[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptvault"
version = "1.10.1"
description = "Web-based prompt manager for organizing and versioning AI prompts."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Medenor" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Utilities",
  "Framework :: FastAPI",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.109.1",
  "uvicorn[standard]>=0.24.0",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.31",
  "aiofiles>=23.2.1",
  "sqlalchemy>=2.0.25",
  "alembic>=1.13.1",
  "psycopg2-binary>=2.9.9",
  "greenlet>=3.0.3",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "httpx<0.27",
  "argon2-cffi>=23.1.0",
  "PyJWT>=2.8.0",
  "cryptography>=41.0.0",
  "slowapi>=0.1.9",
  "redis>=5.0.0",
  "python-jose[cryptography]>=3.3.0",
  "user-agents>=2.2.0",
  "apscheduler>=3.10.0",
  "diff-match-patch>=20230430",
  "click>=8.1.0",
  "rich>=13.0.0",
  "boto3>=1.34.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=0.23.0",
  "freezegun>=1.4.0",
]
dev = [
  "black>=24.0.0",
]
setup = [
  "click>=8.1.0",
  "rich>=13.0.0",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://codeberg.org/medenor/promptvault"
Repository = "https://codeberg.org/medenor/promptvault"
Issues = "https://codeberg.org/medenor/promptvault/issues"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
